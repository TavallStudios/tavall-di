name: Apply DelegatesTo migration

on:
  push:
    branches:
      - working/delegates-to-annotation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Tavall logging
        run: |
          git clone --depth 1 https://github.com/TavallStudios/tavall-logging.git "$RUNNER_TEMP/tavall-logging"
          cat > "$RUNNER_TEMP/tavall-version.init.gradle" <<'GRADLE'
          gradle.afterProject { project, state ->
              if (!state.failure) {
                  project.version = "1.0.0"
              }
          }
          GRADLE
          "$RUNNER_TEMP/tavall-logging/gradlew" -p "$RUNNER_TEMP/tavall-logging" \
            --no-daemon --max-workers=1 -I "$RUNNER_TEMP/tavall-version.init.gradle" \
            -x test publishToMavenLocal
      - name: Apply source migration
        run: python .github/scripts/migrate-delegates_to.py
      - name: Check patch formatting
        run: git diff --check
      - name: Validate standalone module
        id: validation
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=1 clean check publishToMavenLocal \
            > .delegates-to-validation.log 2>&1
          status=$?
          cat .delegates-to-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve validation failure
        if: steps.validation.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Test: Capture DelegatesTo validation failure"
          git push origin HEAD:${GITHUB_REF_NAME}
          exit 1
      - name: Commit validated migration
        if: steps.validation.outputs.status == '0'
        run: |
          rm -f .delegates-to-validation.log
          rm -f .github/workflows/apply-delegates-to-migration.yml
          rm -f .github/scripts/migrate-delegates_to.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Changed: Add DelegatesTo registration"
          git push origin HEAD:${GITHUB_REF_NAME}
