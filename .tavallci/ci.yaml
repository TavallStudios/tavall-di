version: 2

source:
  repository: TavallStudios/tavall-di
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

dependencies:
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source

artifacts:
  - name: tavall-di
    path: build/tavall-ci-artifacts/tavall-di.jar

requiredChecks:
  - quality
  - artifact

checks:
  quality:
    executor: gradle
    tasks:
      - "clean"
      - "check"
      - "assemble"

  artifact:
    executor: gradle
    tasks:
      - tavallCiArtifact
