version: 2
source:
  repository: TavallStudios/tavall-di
  provider: github
build:
  type: gradle
  java: 25
  gradle: 9.6.1
resources:
  mode: SYSTEM
requiredChecks:
  - compilation
  - unit-tests
  - quality
  - artifact
checks:
  compilation:
    executor: gradle
    tasks:
      - classes
  unit-tests:
    executor: gradle
    tasks:
      - test
  quality:
    executor: gradle
    tasks:
      - verifyJarContents
      - javadoc
  artifact:
    executor: gradle
    tasks:
      - tavallCiArtifact
dependencies:
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
    digest: e047172ab7c2be005baf0b2c4b46e230ead78417
    substitutions: 'org.tavall:tavall-logging=:'
    sourceVersion: 1.0.0
    versionProperty: tavallVersion
  - kind: source
    identity: TavallStudios/tavall-custom-enum-java
    role: SHARED_DEP
    selector: required-source
    digest: 2284168910f755a0d13a68fbc821cedc14d0a49b
    substitutions: 'org.tavall:tavall-custom-enum-java=:'
    sourceVersion: 1.0.0
    versionProperty: tavallVersion
  - kind: artifact
    identity: tavall-public-maven-mirror
    role: MAVEN_MIRROR
    selector: sha256
    digest: c945956c42d0e49f28ec925d62956d94668c0b3fab0293d9dd2db028b26d9cd2
artifacts:
  - name: tavall-di
    path: build/tavall-ci-artifacts/tavall-di.jar
    channel: RELEASE
